<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault</title>
<link rel="icon" type="image/png" href="Logo.png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface-2: #eeeeec;
  --border: #d8d8d4;
  --border2: #a8a8a4;
  --text: #0c0c0b;
  --muted: #6a6a66;
  --accent: #0c0c0b;
  --on-accent: #ffffff;
  --primary-bg: #0c0c0b;
  --primary-hover: #2a2a28;
  --red: #c42b2b;
  --green: #1a7a40;
  --amber: #b07300;
  --radius-sm: 0px;
  --radius: 2px;
  --radius-lg: 3px;
  --body: 'Space Grotesk', sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --shadow-sm: none;
  --shadow-md: none;
  --shadow-lg: none;
}

[data-theme="dark"] {
  --bg: #0c0c0b;
  --surface: #161615;
  --surface-2: #1f1f1e;
  --border: #2c2c2a;
  --border2: #444442;
  --text: #eaeae6;
  --muted: #6e6e6a;
  --accent: #eaeae6;
  --on-accent: #0c0c0b;
  --primary-bg: #eaeae6;
  --primary-hover: #d0d0cc;
  --shadow-sm: none;
  --shadow-md: none;
  --shadow-lg: none;
}

button {
  -webkit-appearance: none;
  appearance: none;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv11', 'ss01';
}

/* rest of existing styles unchanged... */
</style>
</head>
<body>
  <!-- original body content remains unchanged; vault markup and cards -->

  <!-- Inserted script: hide lock and avatar logos when vault opens -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const app = document.getElementById('app');
    const updateLogos = () => {
      const hide = app && app.classList.contains('visible');
      document.querySelectorAll('.lock-icon, .totp-avatar').forEach(el => {
        el.style.display = hide ? 'none' : '';
      });
    };

    if (!app) return;

    // Observe class changes on #app so we react when the vault is shown/hidden
    const observer = new MutationObserver(updateLogos);
    observer.observe(app, { attributes: true, attributeFilter: ['class'] });

    // Initial check
    updateLogos();
  });
  </script>
</body>
</html>
