# Vault — Cloudflare Worker with static assets and a D1 database.
# The name must match the Worker in your dashboard (Workers & Pages → encrypted-2fa).
name = "encrypted-2fa"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# No database_id on purpose: Wrangler creates the D1 database on the first deploy and
# the Worker creates its tables on the first request. To use an existing database,
# add  database_id = "<id>"  below.
[[d1_databases]]
binding = "DB"
database_name = "vault"

[vars]
# Your Google sign-in client ID. It is public, so it is safe to keep in this file.
GOOGLE_CLIENT_ID = "407397476387-6dmm67mc66n2i3d798cp44pk7oicftqt.apps.googleusercontent.com"
# Optional: only these Google accounts may sign in (comma-separated).
# ALLOWED_EMAILS = "you@gmail.com"
# Optional: stop new accounts being created (existing accounts keep working).
# ALLOW_SIGNUPS = "false"
